services:
  jobspy-scraper:
    build:
      context: ./jobspy
      dockerfile: Dockerfile
    image: jobspy
    container_name: jobspy-scraper
    entrypoint: []
    command: ["tail", "-f", "/dev/null"]
    env_file: .env
    networks:
      - jobspy-network

  jobspy-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: jobspy-mcp:local
    container_name: jobspy-mcp
    restart: unless-stopped
    ports:
      - "${JOBSPY_PORT:-9423}:9423"
    env_file: .env
    working_dir: /app
    volumes:
      # Docker socket so the MCP server can exec the prebuilt scraper container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["node", "src/index.js"]
    networks:
      - jobspy-network

networks:
  jobspy-network:
    driver: bridge
